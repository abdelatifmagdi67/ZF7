<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دلتا - مجتمع السكريبتات والمتابعات والصوتيات</title>
<style>
:root{--bg:#0b1220;--card:#111c33;--card2:#16233d;--text:#e8eefc;--muted:#9fb0cc;--line:#1f2d4a;--acc:#4cc9f0;--acc2:#b388ff;--ok:#3ddc97;--bad:#ff6b6b;--warn:#f59e0b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;margin:0;padding:20px 14px;overflow-x:hidden;}
.wrap{max-width:800px;margin:0 auto;display:none;}
h2{color:var(--acc);margin-top:0;text-align:center;}
h3{font-size:16px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px; animation: slideUp 0.4s ease backwards;}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:bold}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#06101e;color:var(--text);font-family:monospace;font-size:14px;margin-top:6px;transition:0.3s;}

textarea {
    width: 100%; min-height: 150px; padding: 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #06101e; color: var(--text); font-family: monospace; font-size: 14px; margin-top: 6px;
    direction: ltr; text-align: left; white-space: pre; overflow-x: auto;
}

.btn{padding:10px 16px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;font-size:14px;margin-bottom:5px;display:inline-block;text-decoration:none;transition:0.3s;text-align:center;}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071019}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.btn:active{transform:scale(.95)}
.btn.copy-btn { background: #06101e; color: var(--acc); border: 1px solid var(--line); }
.btn.copy-btn.copied { background: var(--ok); color: #071019; }
.btn-nav { display: flex; gap: 6px; margin-bottom: 15px; overflow-x:auto; }
.btn-nav button { flex: 1; padding: 10px; background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; cursor: pointer; font-weight: bold; white-space:nowrap; }
.btn-nav button.active { background: var(--acc); color: #071019; border-color: var(--acc); }

/* الإطارات والرتب */
.user-badge-box { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
.frame-admin { border: 2px solid var(--bad); background: rgba(255,107,107,0.15); color: #ff8b8b; box-shadow: 0 0 10px rgba(255,107,107,0.5); }
.frame-diamond { border: 2px solid var(--acc); background: rgba(76,201,240,0.15); color: var(--acc); box-shadow: 0 0 8px rgba(76,201,240,0.4); }
.frame-gold { border: 2px solid var(--warn); background: rgba(245,158,11,0.15); color: var(--warn); }
.frame-silver { border: 2px solid var(--muted); background: rgba(159,176,204,0.15); color: var(--muted); }
.frame-bronze { border: 1px solid var(--line); background: var(--card2); color: var(--text); }
.frame-none { border: none; background: transparent; color: var(--text); padding: 0; }

/* شاشات الدخول */
#authScreen { max-width: 400px; margin: 50px auto; background: var(--card); padding: 20px; border-radius: var(--r); border: 1px solid var(--line); text-align: center; }
#authScreen input { margin-bottom: 10px; }
#authScreen .toggle-btn { background: none; border: none; color: var(--acc); cursor: pointer; font-size: 13px; margin-top: 10px; text-decoration: underline; }
.error-msg { color: var(--bad); font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }

/* السكريبتات والتفاعل */
.saved-item{border:1px solid var(--line);border-radius:10px;margin-bottom:15px;background:var(--card2); overflow:hidden;}
.saved-img { width:100%; height:140px; object-fit:cover; border-bottom:1px solid var(--line); background:#000; }
.saved-content { padding:12px; }
.saved-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px}
.saved-title{font-weight:bold;font-size:16px;color:var(--acc)}
.badge { font-size: 11px; background: rgba(179,136,255,0.2); color: var(--acc2); padding: 3px 8px; border-radius: 4px; font-weight: bold; }
.badge.off { background: rgba(255,107,107,0.2); color: var(--bad); }
.author { font-size: 12px; color: var(--muted); margin-top: 5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

/* التعليقات */
.comments-section { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.comment-box { background: var(--card); padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.comment-input-row { display: flex; gap: 5px; margin-top: 8px; }
.comment-input-row input { margin-top: 0; padding: 8px; font-size: 12px; }

/* الجرس والتنبيهات */
.bell-btn { position: relative; background: var(--card2); border: 1px solid var(--line); color: var(--text); padding: 6px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.badge-count { position: absolute; top: -5px; right: -5px; background: var(--bad); color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: bold; display: none; }
.notifications-dropdown { position: absolute; top: 50px; left: 14px; width: 300px; max-height: 350px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); z-index: 1000; padding: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; }
.notif-item { font-size: 12px; padding: 8px; border-bottom: 1px solid var(--line); margin-bottom: 5px; background: var(--card2); border-radius: 6px; }

/* الدردشة الصوتية والصوتيات */
.chat-container { display: flex; flex-direction: column; height: 350px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 10px; }
.chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-word; }
.msg-bubble.sent { background: var(--acc); color: #071019; align-self: flex-end; border-bottom-left-radius: 2px; }
.msg-bubble.received { background: #1c2c4c; color: var(--text); align-self: flex-start; border-bottom-right-radius: 2px; }
.chat-input-area { display: flex; padding: 10px; background: var(--card); border-top: 1px solid var(--line); gap: 6px; align-items: center; }
.chat-input-area input { margin-top: 0; flex: 1; }
.user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 15px; }
.modal-content { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }

#imagePreview { display:none; width:100%; height:120px; object-fit:cover; border-radius:8px; margin-top:10px; border:1px solid var(--line); }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="authScreen" class="hidden">
    <h2>مجتمع دلتا</h2>
    <div id="errorMsg" class="error-msg"></div>
    
    <div id="loginForm">
        <input type="text" id="loginUser" placeholder="اسم المستخدم (اكتب admin للأدمن)">
        <input type="password" id="loginPass" placeholder="كلمة المرور">
        <button class="btn primary" style="width:100%" onclick="doLogin()">تسجيل الدخول</button>
        <button class="toggle-btn" onclick="toggleAuth('register')">معندكش حساب؟ سجل من هنا</button>
    </div>

    <div id="registerForm" class="hidden">
        <input type="text" id="regUser" placeholder="اسم المستخدم">
        <input type="password" id="regPass" placeholder="كلمة المرور (6 حروف على الأقل)">
        <button class="btn primary" style="width:100%" onclick="doRegister()">إنشاء حساب</button>
        <button class="toggle-btn" onclick="toggleAuth('login')">عندك حساب؟ سجل دخول</button>
    </div>
</div>

<!-- الموقع الأساسي -->
<div class="wrap" id="mainUI">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
      <h2 style="margin:0;">دلتا <span id="adminBadge" style="font-size:12px; background:var(--bad); color:#fff; padding:2px 6px; border-radius:4px; display:none;">أدمن عام</span></h2>
      
      <div style="display:flex; align-items:center; gap:8px; position:relative;">
          <button class="bell-btn" onclick="toggleNotifications()">
              🔔 التنبيهات
              <span id="notifBadge" class="badge-count">0</span>
          </button>
          
          <div id="notifDropdown" class="notifications-dropdown">
              <h4 style="margin:0 0 8px 0; font-size:13px; color:var(--acc);">التنبيهات الجديدة:</h4>
              <div id="notifList">لا توجد تنبيهات جديدة.</div>
          </div>

          <a href="https://discord.gg/YOUR_DISCORD_LINK" target="_blank" class="btn sm" style="background:#5865F2; color:#fff; text-decoration:none; display:inline-flex; align-items:center; gap:5px; margin-bottom:0;">ديسكورد</a>
          <div id="userHeaderDisplay" style="display:inline-block;"></div>
          <button class="btn sm" onclick="doLogout()" style="background:transparent;color:var(--bad);border:1px solid var(--bad); margin-bottom:0;">خروج</button>
      </div>
  </div>

  <div class="btn-nav">
      <button id="navAdd" class="active" onclick="switchTab('add')">نشر</button>
      <button id="navObf" onclick="switchTab('obf')">التمويه</button>
      <button id="navMy" onclick="switchTab('my')">سكريبتاتي</button>
      <button id="navComm" onclick="switchTab('comm')">المجتمع</button>
      <button id="navChat" onclick="switchTab('chat')">المراسلات والصوتيات</button>
  </div>

  <!-- إضافة سكريبت -->
  <div id="tabAdd">
      <div class="card">
        <div style="background:var(--card2); padding:10px; border-radius:8px; margin-bottom:15px; border:1px solid var(--line);">
            <label style="margin-bottom:5px; color:var(--acc);">🎨 إطار اسمك الشخصي:</label>
            <select id="userFrameSelect" onchange="updateUserFrame(this.value)">
                <option value="bronze">🥉 مبتدئ (Bronze)</option>
                <option value="silver">🥈 مطور صاعد (Silver)</option>
                <option value="gold">🥇 محترف سكريبتات (Gold)</option>
                <option value="diamond">💎 أسطورة دلتا (Diamond)</option>
                <option value="none">❌ بدون إطار</option>
            </select>
        </div>

        <label>اسم السكريبت<input type="text" id="scriptName" placeholder="مثلاً: سكريبت طيران"></label>
        <label>التصنيف
          <select id="scriptCategory">
              <option value="عام">عام</option>
              <option value="MM2">MM2</option>
              <option value="ماب السرقة">ماب السرقة</option>
              <option value="تايم بومب">تايم بومب</option>
          </select>
        </label>
        <label>صورة السكريبت (اختياري)
          <input type="file" id="scriptImage" accept="image/*" onchange="handleImageUpload(event)" style="padding:10px; background:var(--card2); border:1px dashed var(--acc);">
          <input type="hidden" id="scriptImageData">
        </label>
        <img id="imagePreview" src="" alt="معاينة">
        
        <label style="margin-top:15px;">كود السكريبت (Lua)<textarea id="scriptCode" placeholder="-- الزق الكود هنا" spellcheck="false"></textarea></label>
        <button class="btn primary" id="saveBtn" onclick="saveScriptWithAI()" style="width:100%; margin-top:10px;">🚀 نشر السكريبت</button>
      </div>
  </div>

  <!-- أداة التمويه -->
  <div id="tabObf" class="hidden">
      <div class="card">
          <h3>تمويه السكريبت (Delta Obfuscator)</h3>
          <textarea id="plainCode" placeholder="-- اكتب الكود هنا --" spellcheck="false"></textarea>
          <button class="btn primary" style="width:100%; margin-top:10px; font-size:16px;" onclick="obfuscateCode()">🔐 تمويه السكريبت</button>
          <label style="margin-top:20px;">الكود المموه (تحت)</label>
          <textarea id="encryptedCode" placeholder="-- الكود المموه هيظهر هنا --" readonly spellcheck="false"></textarea>
          <button class="btn copy-btn" style="width:100%; margin-top:5px;" onclick="copyText(document.getElementById('encryptedCode').value, this)">📋 نسخ الكود المموه</button>
      </div>
  </div>

  <!-- سكريبتاتي -->
  <div id="tabMy" class="hidden">
      <div id="myList"><p style="color:var(--muted);text-align:center;">جاري التحميل...</p></div>
  </div>

  <!-- المجتمع والمتابعات -->
  <div id="tabComm" class="hidden">
      <div class="card" style="padding:10px; display:flex; gap:8px; align-items:center;">
          <input type="text" id="searchInput" placeholder="ابحث باسم السكريبت..." oninput="filterCommunity()" style="margin-top:0; flex:1;">
          <button class="btn sm" id="toggleFeedBtn" onclick="toggleFeedMode()" style="background:var(--card2); border:1px solid var(--line); color:var(--acc);">⭐ سكريبتات المتابَعين</button>
      </div>
      <div id="communityList"><p style="color:var(--muted);text-align:center;">المجتمع فاضي.</p></div>
  </div>

  <!-- المراسلات والصوتيات والأصدقاء -->
  <div id="tabChat" class="hidden">
      <div id="adminSettingsPanel" class="card hidden" style="border-color: var(--acc2);">
          <h3 style="color: var(--acc2);">⚙️ إعدادات الأدمن المركزي</h3>
          <input type="password" id="adminGlobalApiKey" placeholder="أدخل مفتاح Gemini API هنا..." style="margin-bottom:10px; font-size:12px;">
          <button class="btn sm primary" onclick="saveGlobalApiKey()">حفظ المفتاح</button>
      </div>

      <div id="adminBanPanel" class="card hidden" style="border-color: var(--bad);">
          <h3 style="color: var(--bad);">🚨 لوحة الأدمن</h3>
          <div id="adminReportsList" style="max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
          <div id="adminBannedList"></div>
      </div>

      <div class="card">
          <h3>👥 الأصدقاء والمتابَِعون</h3>
          <div id="friendsList" style="margin-bottom:15px; font-size:13px; color:var(--muted);">لا توجد أصدقاء حالياً.</div>

          <h3>البحث عن الأعضاء</h3>
          <input type="text" id="userSearchInput" placeholder="ابحث عن اسم المستخدم..." oninput="searchUsers()" style="margin-bottom:12px;">
          <div id="userSearchResults" style="margin-bottom:15px;"></div>

          <div id="activeChatBox" class="hidden" style="margin-top:15px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <span id="chatWithTitle" style="font-weight:bold; color:var(--acc);">المحادثة مع: -</span>
                  <button class="btn sm" onclick="closeChat()" style="background:var(--bad); color:white;">إغلاق الشات</button>
              </div>
              <div class="chat-container">
                  <div class="chat-messages" id="chatMessages"></div>
                  <div class="chat-input-area">
                      <input type="text" id="chatMsgInput" placeholder="اكتب رسالتك...">
                      <!-- زرار تسجيل الصوت -->
                      <button class="btn sm" id="recordVoiceBtn" onclick="toggleVoiceRecording()" style="background:var(--card2); color:var(--bad); border:1px solid var(--line);" title="تسجيل رسالة صوتية">🎤</button>
                      <input type="file" id="chatImgInput" accept="image/*" style="display:none;" onchange="sendChatImage(event)">
                      <button class="btn sm primary" onclick="document.getElementById('chatImgInput').click()">📷</button>
                      <button class="btn sm primary" onclick="sendChatMessage()">إرسال</button>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>

<!-- نافذة التعديل -->
<div id="editModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>✏️ تعديل السكريبت</h3>
        <input type="hidden" id="editScriptId">
        <label>اسم السكريبت<input type="text" id="editScriptName"></label>
        <label>التصنيف
            <select id="editScriptCategory">
                <option value="عام">عام</option>
                <option value="MM2">MM2</option>
                <option value="ماب السرقة">ماب السرقة</option>
                <option value="تايم بومب">تايم بومب</option>
            </select>
        </label>
        <label>كود السكريبت (Lua)<textarea id="editScriptCode" spellcheck="false"></textarea></label>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn primary" style="flex:1;" onclick="updateScript()">حفظ التعديلات</button>
            <button class="btn" style="background:var(--bad); color:white;" onclick="closeEditModal()">إلغاء</button>
        </div>
    </div>
</div>

<!-- أكواد التطبيق -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot, deleteDoc, doc, updateDoc, setDoc, getDoc, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2DjPpzfS8QT9cJoTdyzSMuwcJfN8Ulrw",
    authDomain: "cjw-7cf9b.firebaseapp.com",
    projectId: "cjw-7cf9b",
    storageBucket: "cjw-7cf9b.firebasestorage.app",
    messagingSenderId: "425929622528",
    appId: "1:425929622528:web:51f12538ede4f0025c84e5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUsername = "";
  let currentUserDocId = "";
  let userFrameSetting = "bronze";
  let allScriptsCache = [];
  let allCommentsCache = [];
  let allLikesCache = [];
  let allUsersCache = [];
  let allFriendsCache = [];
  let notifsCache = [];
  let activeChatUser = null;
  let chatUnsubscribe = null;
  let isOnlyFollowingFeed = false;

  // متغيرات التسجيل الصوتي
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  const DELTA_KEY = "DeltaHubSecureKey2026";

  window.encodeCode = (str) => btoa(unescape(encodeURIComponent(str)));
  window.decodeCode = (str) => decodeURIComponent(escape(atob(str)));

  async function getGlobalApiKey() {
      try {
          const snap = await getDoc(doc(db, "settings", "ai_config"));
          if (snap.exists()) return snap.data().apiKey || "";
      } catch(e) {}
      return "";
  }

  window.saveGlobalApiKey = async () => {
      const key = document.getElementById('adminGlobalApiKey').value.trim();
      if(!key) return alert("اكتب المفتاح الأول!");
      await setDoc(doc(db, "settings", "ai_config"), { apiKey: key });
      alert("✅ تم الحفظ!");
  };

  window.checkContentWithGemini = async (text, imgData = null) => {
      const apiKey = await getGlobalApiKey();
      if(!apiKey) return { safe: true };

      const promptText = `أنت نظام حماية تلقائي. قم بفحص النص أو الصورة التالية. هل تحتوي على شتايم، سباب، إباحية؟ أجب بـ "SAFE" أو "UNSAFE". المحتوى: ${text}`;
      try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
          });
          const data = await response.json();
          if(data.candidates && data.candidates[0].content) {
              const aiReply = data.candidates[0].content.parts[0].text.trim();
              if(aiReply.toUpperCase().startsWith("UNSAFE")) return { safe: false, reason: "مخالف" };
          }
          return { safe: true };
      } catch(e) { return { safe: true }; }
  };

  window.getUserDisplayHTML = (username) => {
      if (username === 'admin') return `<span class="user-badge-box frame-admin">👑 [أدمن الأساطير] ${username}</span>`;
      const uData = allUsersCache.find(u => u.username === username);
      const frame = uData ? (uData.frame || 'bronze') : 'bronze';
      const userScripts = allScriptsCache.filter(s => s.author === username);
      const totalLikes = allLikesCache.filter(l => userScripts.map(s=>s.id).includes(l.scriptId)).length;

      let levelTitle = "🥉 مبتدئ";
      let frameClass = "frame-bronze";
      if (totalLikes >= 15 || userScripts.length >= 5) { levelTitle = "💎 أسطورة دلتا"; frameClass = "frame-diamond"; }
      else if (totalLikes >= 7 || userScripts.length >= 3) { levelTitle = "🥇 محترف سكريبتات"; frameClass = "frame-gold"; }
      else if (totalLikes >= 3 || userScripts.length >= 1) { levelTitle = "🥈 مطور صاعد"; frameClass = "frame-silver"; }

      if (frame === 'none') return `<span class="user-badge-box frame-none">👤 ${username} (${levelTitle})</span>`;
      return `<span class="user-badge-box ${frameClass}">👤 ${username} [${levelTitle}]</span>`;
  };

  window.updateUserFrame = async (newFrame) => {
      userFrameSetting = newFrame;
      if (currentUserDocId) {
          await updateDoc(doc(db, "users", currentUserDocId), { frame: newFrame });
          renderHeaderUser(); renderLists();
      }
  };

  function renderHeaderUser() {
      document.getElementById('userHeaderDisplay').innerHTML = getUserDisplayHTML(currentUsername);
  }

  // معالجة الـ RAW
  if (new URLSearchParams(window.location.search).has('raw')) {
      const rawId = new URLSearchParams(window.location.search).get('raw');
      getDoc(doc(db, "scripts", rawId)).then((snap) => {
          document.open();
          if (snap.exists()) {
              const data = snap.data();
              document.write(data.disabled ? `warn("Disabled");` : data.code);
          } else { document.write(`-- Script not found`); }
          document.close();
      });
  }

  window.toggleAuth = (type) => {
      document.getElementById('loginForm').classList.toggle('hidden', type !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', type !== 'register');
  };

  window.handleImageUpload = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = 500; canvas.height = (img.height * 500) / img.width;
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
              document.getElementById('scriptImageData').value = dataUrl;
              const preview = document.getElementById('imagePreview');
              preview.src = dataUrl; preview.style.display = 'block';
          };
          img.src = e.target.result;
      };
      reader.readAsDataURL(file);
  };

  window.obfuscateCode = () => {
      const plain = document.getElementById('plainCode').value;
      if(!plain) return alert("اكتب الكود الأول!");
      const utf8 = new TextEncoder().encode(plain);
      const encryptedBytes = [];
      for (let i = 0; i < utf8.length; i++) encryptedBytes.push(utf8[i] ^ DELTA_KEY.charCodeAt(i % DELTA_KEY.length));
      
      const luaScript = `local _k = "${DELTA_KEY}"\nlocal _e = {${encryptedBytes.join(',')}}\nlocal _s = ""\nfor i = 1, #_e do\n    local _kc = string.byte(_k, (i - 1) % #_k + 1)\n    _s = _s .. string.char(bit32.bxor(_e[i], _kc))\nend\nassert(loadstring(_s))()`;
      document.getElementById('encryptedCode').value = luaScript;
  };

  window.doRegister = async () => {
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;
      if(!username || !password) return alert("املا الخانات!");
      try {
          const q = query(collection(db, "users"), where("username", "==", username));
          if (!(await getDocs(q)).empty) return alert("⚠️ الاسم متاخد!");
          const cred = await createUserWithEmailAndPassword(auth, username.toLowerCase() + "@delta.com", password);
          await addDoc(collection(db, "users"), { uid: cred.user.uid, username: username, warnings: 0, frame: 'bronze' });
          alert("تم التسجيل بنجاح!"); toggleAuth('login');
      } catch(e) { alert("خطأ: " + e.message); }
  };

  window.doLogin = async () => {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      try { await signInWithEmailAndPassword(auth, username.toLowerCase() + "@delta.com", password); }
      catch(e) { alert("❌ خطأ في البيانات!"); }
  };

  window.doLogout = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
      if (user) {
          currentUser = user;
          const q = query(collection(db, "users"), where("uid", "==", user.uid));
          const snap = await getDocs(q);
          if(!snap.empty) {
              const uDoc = snap.docs[0];
              currentUserDocId = uDoc.id;
              const uData = uDoc.data();
              currentUsername = uData.username;
              userFrameSetting = uData.frame || 'bronze';
              document.getElementById('userFrameSelect').value = userFrameSetting;

              if(currentUsername === 'admin') {
                  document.getElementById('adminBadge').style.display = 'inline-block';
                  document.getElementById('adminBanPanel').classList.remove('hidden');
                  document.getElementById('adminSettingsPanel').classList.remove('hidden');
                  getGlobalApiKey().then(k => { if(k) document.getElementById('adminGlobalApiKey').value = k; });
              }

              document.getElementById('authScreen').classList.add('hidden');
              document.querySelector('.wrap').style.display = 'block';
              loadAllData();
          }
      } else {
          currentUser = null; currentUsername = ""; currentUserDocId = "";
          document.getElementById('authScreen').classList.remove('hidden');
          document.querySelector('.wrap').style.display = 'none';
      }
  });

  window.switchTab = (tab) => {
      ['add', 'obf', 'my', 'comm', 'chat'].forEach(t => {
          document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('hidden');
          document.getElementById('nav' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('active');
      });
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
      document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  };

  function loadAllData() {
      onSnapshot(collection(db, "users"), (snap) => { allUsersCache = snap.docs.map(d => d.data()); renderHeaderUser(); });
      onSnapshot(collection(db, "scripts"), (snap) => { allScriptsCache = snap.docs.map(d => ({id: d.id, ...d.data()})); renderLists(); });
      onSnapshot(collection(db, "script_likes"), (snap) => { allLikesCache = snap.docs.map(d => ({id: d.id, ...d.data()})); renderLists(); });
      onSnapshot(collection(db, "script_comments"), (snap) => { allCommentsCache = snap.docs.map(d => ({id: d.id, ...d.data()})); renderLists(); });
      onSnapshot(collection(db, "friendships"), (snap) => { allFriendsCache = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(f => f.user === currentUsername); renderFriendsList(); renderLists(); });
      onSnapshot(collection(db, "notifications"), (snap) => { notifsCache = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(n => n.recipient === currentUsername); renderNotifications(); });
  }

  window.saveScriptWithAI = async () => {
      const name = document.getElementById('scriptName').value.trim();
      const cat = document.getElementById('scriptCategory').value;
      const code = document.getElementById('scriptCode').value;
      const imgData = document.getElementById('scriptImageData').value;
      if(!name || !code) return alert("املا الخانات!");

      const btn = document.getElementById('saveBtn');
      btn.textContent = "🤖 جاري الفحص..."; btn.disabled = true;

      try {
          const aiCheck = await checkContentWithGemini(`الاسم: ${name}\nالكود: ${code}`, imgData);
          if (!aiCheck.safe) { alert(`❌ رفض بواسطة الحماية`); btn.disabled = false; btn.textContent = "🚀 نشر السكريبت"; return; }

          await addDoc(collection(db, "scripts"), {
              name: name, category: cat, code: code, author: currentUsername, uid: currentUser.uid, image: imgData || "", disabled: false, createdAt: serverTimestamp()
          });
          alert("✅ تم النشر!"); switchTab('my');
      } catch(e) { alert("خطأ: " + e.message); }
      finally { btn.disabled = false; btn.textContent = "🚀 نشر السكريبت"; }
  };

  window.toggleFeedMode = () => {
      isOnlyFollowingFeed = !isOnlyFollowingFeed;
      const btn = document.getElementById('toggleFeedBtn');
      if (isOnlyFollowingFeed) {
          btn.style.background = 'var(--acc)'; btn.style.color = '#071019';
          btn.textContent = "⭐ عرض الكل";
      } else {
          btn.style.background = 'var(--card2)'; btn.style.color = 'var(--acc)';
          btn.textContent = "⭐ سكريبتات المتابَعين";
      }
      renderLists();
  };

  function renderLists() {
      if(!currentUser) return;
      const myList = document.getElementById('myList');
      const commList = document.getElementById('communityList');
      const myScripts = allScriptsCache.filter(s => s.uid === currentUser.uid);
      
      const myFriendsNames = allFriendsCache.map(f => f.friend);
      let commScripts = allScriptsCache.filter(s => s.uid !== currentUser.uid);

      if (isOnlyFollowingFeed) {
          commScripts = commScripts.filter(s => myFriendsNames.includes(s.author));
      }

      myList.innerHTML = myScripts.length ? myScripts.map(s => generateCard(s, true)).join('') : '<p style="color:var(--muted);text-align:center;">مفيش سكريبتات ليك.</p>';
      commList.innerHTML = commScripts.length ? commScripts.map(s => generateCard(s, false)).join('') : `<p style="color:var(--muted);text-align:center;">${isOnlyFollowingFeed ? 'مفيش سكريبتات من الأشخاص اللي متابعهم حالياً.' : 'المجتمع فاضي.'}</p>`;
  }

  function generateCard(s, isMine) {
      const rawUrl = `https://deltarx.devs.li/?raw=${s.id}`;
      const lua = `loadstring(game:HttpGet("${rawUrl}"))()`;
      const displayImage = s.image ? s.image : "https://images.unsplash.com/photo-1614680376593-902f74cf0d41?auto=format&fit=crop&w=500&q=80";
      const isAdmin = (currentUsername === 'admin');
      const canDelete = isMine || isAdmin;
      const scriptLikes = allLikesCache.filter(l => l.scriptId === s.id);
      const hasLiked = scriptLikes.some(l => l.user === currentUsername);
      const scriptComments = allCommentsCache.filter(c => c.scriptId === s.id);

      return `
      <div class="saved-item">
        <img src="${displayImage}" class="saved-img" alt="${s.name}">
        <div class="saved-content">
            <div class="saved-header">
              <div>
                  <span class="saved-title">${s.name}</span> 
                  <span class="badge ${s.disabled ? 'off' : ''}">${s.disabled ? '⛔ متوقف' : s.category}</span>
              </div>
              <div>
                  ${isMine ? `<button class="btn sm primary" onclick="openEditModal('${s.id}')">✏️ تعديل</button>` : ''}
                  ${canDelete ? `<button class="btn sm" style="background:var(--bad);color:white;" onclick="deleteDoc(doc(db,'scripts','${s.id}'))">🗑️ حذف</button>` : ''}
              </div>
            </div>
            <div class="author">بواسطة: ${getUserDisplayHTML(s.author)}</div>
            
            <div style="margin-top:8px;">
                <button class="btn sm" style="background:${hasLiked ? 'var(--bad)' : 'var(--card)'}; color:#fff;" onclick="toggleLike('${s.id}', '${s.author}')">❤️ ${scriptLikes.length} إعجاب</button>
            </div>

            <textarea readonly style="min-height:65px; margin-top:8px; font-size:12px; color:var(--ok);">${lua}</textarea>
            <button class="btn copy-btn" style="width:100%; margin-top:5px;" onclick="copyText(\`${lua}\`, this)">📋 نسخ السكريبت كاملاً</button>

            <div class="comments-section">
                <div style="font-size:12px; color:var(--acc2); margin-bottom:5px;">💬 التعليقات (${scriptComments.length}):</div>
                <div style="max-height:90px; overflow-y:auto; margin-bottom:5px;">
                    ${scriptComments.length ? scriptComments.map(c => `<div class="comment-box">${getUserDisplayHTML(c.user)}:${c.text}</div>`).join('') : '<div style="font-size:11px; color:var(--muted);">لا توجد تعليقات.</div>'}
                </div>
                <div class="comment-input-row">
                    <input type="text" id="comment_${s.id}" placeholder="اكتب تعليقاً...">
                    <button class="btn sm primary" onclick="addComment('${s.id}', '${s.author}')">إرسال</button>
                </div>
            </div>
        </div>
      </div>`;
  }

  window.toggleLike = async (scriptId, author) => {
      const existing = allLikesCache.find(l => l.scriptId === scriptId && l.user === currentUsername);
      if (existing) await deleteDoc(doc(db, "script_likes", existing.id));
      else {
          await addDoc(collection(db, "script_likes"), { scriptId, user: currentUsername, createdAt: serverTimestamp() });
          if(author !== currentUsername) await addDoc(collection(db, "notifications"), { recipient: author, message: `أعجب ${currentUsername} بسكريبتك! ❤️`, read: false, createdAt: serverTimestamp() });
      }
  };

  window.addComment = async (scriptId, author) => {
      const input = document.getElementById(`comment_${scriptId}`);
      const txt = input.value.trim(); if(!txt) return; input.value = '';
      await addDoc(collection(db, "script_comments"), { scriptId, user: currentUsername, text: txt, createdAt: serverTimestamp() });
      if(author !== currentUsername) await addDoc(collection(db, "notifications"), { recipient: author, message: `تعليق جديد من ${currentUsername} 💬`, read: false, createdAt: serverTimestamp() });
  };

  window.toggleNotifications = () => {
      const d = document.getElementById('notifDropdown');
      d.style.display = d.style.display === 'block' ? 'none' : 'block';
  };

  function renderNotifications() {
      const list = document.getElementById('notifList');
      const badge = document.getElementById('notifBadge');
      const unread = notifsCache.filter(n => !n.read);
      if(unread.length > 0) { badge.textContent = unread.length; badge.style.display = 'inline-block'; }
      else badge.style.display = 'none';

      list.innerHTML = notifsCache.length ? notifsCache.map(n => `<div class="notif-item">${n.message}</div>`).join('') : '<div style="font-size:12px; color:var(--muted); text-align:center;">لا توجد تنبيهات.</div>';
  }

  window.addFriend = async (friend) => {
      await addDoc(collection(db, "friendships"), { user: currentUsername, friend, createdAt: serverTimestamp() });
      await addDoc(collection(db, "notifications"), { recipient: friend, message: `أضافك ${currentUsername} كمتابع وصديق 🤝`, read: false, createdAt: serverTimestamp() });
      alert("تمت المتابعة والإضافة!");
  };

  function renderFriendsList() {
      const div = document.getElementById('friendsList');
      div.innerHTML = allFriendsCache.length ? allFriendsCache.map(f => `<div style="display:flex; justify-content:space-between; align-items:center; background:var(--card2); padding:6px 10px; border-radius:6px; margin-bottom:4px;"><span>🤝 ${f.friend}</span><button class="btn sm primary" onclick="startChat('${f.friend}')">مراسلة</button></div>`).join('') : '<span style="color:var(--muted);">لا توجد أصدقاء أو متابَعين حالياً.</span>';
  }

  window.searchUsers = async () => {
      const val = document.getElementById('userSearchInput').value.trim().toLowerCase();
      const res = document.getElementById('userSearchResults');
      if(!val) { res.innerHTML = ''; return; }
      const snap = await getDocs(collection(db, "users"));
      const users = snap.docs.map(d => d.data()).filter(u => u.username.toLowerCase().includes(val) && u.username !== currentUsername);
      res.innerHTML = users.length ? users.map(u => `<div class="user-row"><span>${getUserDisplayHTML(u.username)}</span><div><button class="btn sm primary" onclick="startChat('${u.username}')">مراسلة</button><button class="btn sm" style="background:var(--ok); color:#000;" onclick="addFriend('${u.username}')">➕ متابعة</button></div></div>`).join('') : '<p style="color:var(--muted); font-size:12px;">لا يوجد مستخدم.</p>';
  };

  window.startChat = (target) => {
      activeChatUser = target;
      document.getElementById('chatWithTitle').textContent = 'المحادثة مع: ' + target;
      document.getElementById('activeChatBox').classList.remove('hidden');
      loadMessages();
  };

  window.closeChat = () => { activeChatUser = null; document.getElementById('activeChatBox').classList.add('hidden'); if(chatUnsubscribe) chatUnsubscribe(); };

  window.sendChatMessage = async () => {
      const txt = document.getElementById('chatMsgInput').value.trim(); if(!txt || !activeChatUser) return;
      document.getElementById('chatMsgInput').value = '';
      await addDoc(collection(db, "messages"), { sender: currentUsername, receiver: activeChatUser, text: txt, audio: "", createdAt: serverTimestamp() });
      await addDoc(collection(db, "notifications"), { recipient: activeChatUser, message: `رسالة جديدة من ${currentUsername} ✉️`, read: false, createdAt: serverTimestamp() });
  };

  // نظام تسجيل وبث الرسائل الصوتية
  window.toggleVoiceRecording = async () => {
      const btn = document.getElementById('recordVoiceBtn');
      if (!isRecording) {
          try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaRecorder = new MediaRecorder(stream);
              audioChunks = [];

              mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
              mediaRecorder.onstop = async () => {
                  const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                  const reader = new FileReader();
                  reader.readAsDataURL(audioBlob);
                  reader.onloadend = async () => {
                      const base64Audio = reader.result;
                      await addDoc(collection(db, "messages"), { sender: currentUsername, receiver: activeChatUser, text: "", audio: base64Audio, createdAt: serverTimestamp() });
                      await addDoc(collection(db, "notifications"), { recipient: activeChatUser, message: `رسالة صوتية جديدة من ${currentUsername} 🎤`, read: false, createdAt: serverTimestamp() });
                  };
              };

              mediaRecorder.start();
              isRecording = true;
              btn.style.background = 'var(--bad)'; btn.style.color = '#fff';
              btn.textContent = "⏹️ إيقاف وإرسال";
          } catch(e) { alert("⚠️ تعذر الوصول للميكروفون! تأكد من السماح بالصلاحيات."); }
      } else {
          mediaRecorder.stop();
          isRecording = false;
          btn.style.background = 'var(--card2)'; btn.style.color = 'var(--bad)';
          btn.textContent = "🎤";
      }
  };

  function loadMessages() {
      if(chatUnsubscribe) chatUnsubscribe();
      chatUnsubscribe = onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "asc")), (snap) => {
          const msgs = snap.docs.map(d => d.data()).filter(m => (m.sender === currentUsername && m.receiver === activeChatUser) || (m.sender === activeChatUser && m.receiver === currentUsername));
          const box = document.getElementById('chatMessages');
          box.innerHTML = msgs.length ? msgs.map(m => `
              <div class="msg-bubble ${m.sender === currentUsername ? 'sent' : 'received'}">
                  ${m.text ? `<div>${m.text}</div>` : ''}
                  ${m.audio ? `<audio controls style="max-width:220px; height:35px;"><source src="${m.audio}" type="audio/webm"></audio>` : ''}
              </div>
          `).join('') : '<p style="color:var(--muted); text-align:center;">لا توجد رسائل.</p>';
          box.scrollTop = box.scrollHeight;
      });
  }

  window.copyText = (text, btn) => {
      navigator.clipboard.writeText(text).then(() => {
          btn.textContent = '✓'; btn.style.background = 'var(--ok)';
          setTimeout(() => { btn.textContent = '📋 نسخ السكريبت كاملاً'; btn.style.background = ''; }, 1500);
      });
  };
</script>
</body>
</html>
